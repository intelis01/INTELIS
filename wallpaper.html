<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo de Pantalla Web | INTELIS</title>
  <style>
    :root {
      --navy: #06142b;
      --navy-2: #0b2450;
      --green: #00c896;
      --cyan: #31d8ff;
      --white: #f7fbff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background: var(--navy);
    }

    .wallpaper {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      isolation: isolate;
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 200, 150, 0.34), transparent 28rem),
        radial-gradient(circle at 86% 18%, rgba(49, 216, 255, 0.22), transparent 24rem),
        radial-gradient(circle at 70% 78%, rgba(0, 200, 150, 0.18), transparent 22rem),
        linear-gradient(135deg, #041021 0%, var(--navy) 42%, var(--navy-2) 100%);
    }

    .wallpaper::before,
    .wallpaper::after {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: -2;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at center, black 0 42%, transparent 78%);
      transform: perspective(900px) rotateX(58deg) translateY(10%);
      animation: grid-drift 18s linear infinite;
    }

    .wallpaper::after {
      z-index: -1;
      background: conic-gradient(from 90deg, transparent, rgba(0, 200, 150, 0.24), transparent, rgba(49, 216, 255, 0.18), transparent);
      filter: blur(70px);
      opacity: 0.65;
      animation: aurora-spin 16s ease-in-out infinite alternate;
    }

    .orb {
      position: absolute;
      width: clamp(12rem, 24vw, 25rem);
      aspect-ratio: 1;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.55), rgba(0, 200, 150, 0.28) 28%, rgba(49, 216, 255, 0.08) 62%, transparent 72%);
      box-shadow: 0 0 80px rgba(0, 200, 150, 0.32);
      filter: blur(1px);
      opacity: 0.75;
      animation: float 8s ease-in-out infinite;
    }

    .orb--one { top: 9%; left: 8%; }
    .orb--two {
      right: 7%;
      bottom: 8%;
      width: clamp(10rem, 18vw, 18rem);
      animation-delay: -3.5s;
      animation-duration: 10s;
    }

    .content {
      width: min(92vw, 900px);
      padding: clamp(2rem, 6vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.035));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      padding: 0.65rem 1rem;
      border: 1px solid rgba(0, 200, 150, 0.45);
      border-radius: 999px;
      color: #91ffe3;
      background: rgba(0, 200, 150, 0.12);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: clamp(0.72rem, 1.4vw, 0.85rem);
      font-weight: 700;
    }

    .badge::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px var(--green);
    }

    h1 {
      font-size: clamp(3.2rem, 11vw, 9rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
      text-wrap: balance;
      text-shadow: 0 16px 50px rgba(0, 0, 0, 0.38);
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, var(--green), #d8fff5, var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
    }

    p {
      max-width: 620px;
      margin: 1.6rem auto 0;
      color: rgba(247, 251, 255, 0.78);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.75;
    }

    .rings {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(82vw, 760px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      translate: -50% -50%;
      z-index: -1;
      animation: pulse 5s ease-in-out infinite;
    }

    .rings::before,
    .rings::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: inherit;
      border: inherit;
    }

    .rings::after { inset: 25%; }

    @keyframes grid-drift {
      to { background-position: 72px 72px; }
    }

    @keyframes aurora-spin {
      to { transform: rotate(22deg) scale(1.12); }
    }

    @keyframes float {
      50% { transform: translate3d(1.4rem, -1.8rem, 0) scale(1.04); }
    }

    @keyframes pulse {
      50% { opacity: 0.35; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <main class="wallpaper" aria-label="Fondo de pantalla web animado de INTELIS">
    <div class="orb orb--one" aria-hidden="true"></div>
    <div class="orb orb--two" aria-hidden="true"></div>
    <div class="rings" aria-hidden="true"></div>

    <section class="content">
      <div class="badge">Wallpaper web</div>
      <h1>INTELIS <span>Future Finance</span></h1>
      <p>
        Un fondo de pantalla web responsivo con efecto glassmorphism, luces aurora,
        partículas suaves y profundidad visual para pantallas modernas.
      </p>
    </section>
  </main>
</body>
</html>
